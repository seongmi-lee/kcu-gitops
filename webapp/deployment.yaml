apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: 609417967491.dkr.ecr.ap-northeast-2.amazonaws.com/webapp:baff8549bebd034e5d4513971a665e050f5c9719
          ports:
            - containerPort: 80
